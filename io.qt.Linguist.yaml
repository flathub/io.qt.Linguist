id: io.qt.Linguist
runtime: org.kde.Sdk
runtime-version: "6.10"
sdk: org.kde.Sdk
command: linguist
finish-args:
  - --socket=fallback-x11
  - --filesystem=host:rw
  - --socket=wayland
  - --device=dri
  - --share=ipc

modules:
  # We build qt6-qttools module to just to get linguist binary
  # which upstream it to reduce the SDK size
  - name: qt6-qttools
    buildsystem: cmake-ninja
    post-install:
      # Create a temp location before cleanup the module
      # and move the linguist binary
      - mkdir -p /app/qt6-qttools/
      - mv /app/bin/linguist /app/qt6-qttools/linguist
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.10/6.10.2/submodules/qttools-everywhere-src-6.10.2.tar.xz
        sha256: 1e3d2c07c1fd76d2425c6eaeeaa62ffaff5f79210c4e1a5bc2a6a9db668d5b24

  - name: linguist
    buildsystem: simple
    build-commands:
      # Move the linguist binary to final location
      - mv /app/qt6-qttools/linguist /app/bin/linguist
      - install -Dm644 io.qt.Linguist.png -t $FLATPAK_DEST/share/icons/hicolor/128x128/apps
      - install -Dm644 io.qt.Linguist.desktop -t $FLATPAK_DEST/share/applications
      - install -Dm644 io.qt.Linguist.metainfo.xml -t $FLATPAK_DEST/share/metainfo
    sources:
      - type: file
        path: io.qt.Linguist.png

      - type: file
        path: io.qt.Linguist.desktop

      - type: file
        path: io.qt.Linguist.metainfo.xml
